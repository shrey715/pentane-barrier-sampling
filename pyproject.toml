[project]
name = "pentane-simulation"
version = "2.0.0"
description = "n-Pentane TraPPE-UA: Umbrella Sampling, REUS, and WHAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentane"]
