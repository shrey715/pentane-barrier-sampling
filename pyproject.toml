[project]
name = "pentane-simulation"
version = "1.0.0"
description = "Molecular Modeling Mini-Project: Escaping the Pentane Barrier using TraPPE-UA force field"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentane"]
