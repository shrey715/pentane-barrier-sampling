[project]
name = "n-pentane-simulation"
version = "2.0.0"
description = "n-Pentane TraPPE-UA: Cartesian Umbrella Sampling and WHAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "openmm>=8.5.1",
    "pytest>=9.0.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentane"]
